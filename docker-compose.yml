version: "3.9"

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: always
    ports:
      - "8096:8096"
    volumes:
      # Jellyfin config and cache
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      # Media directories (read-only)
      - /mnt/media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096

  flask-media-manager:
    build: 
      context: ./senkloud-backend
      dockerfile: Dockerfile
    container_name: flask-media-manager
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # Media directory with write access
      - /mnt/media:/mnt/media
      # Persistent storage for user data and thumbnails
      - flask_data:/app/data
      - flask_thumbnails:/app/static/thumbnails
    environment:
      - SECRET_KEY=local-media-server-secret-key-2024
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=  # Set this after configuring Jellyfin
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
    depends_on:
      - jellyfin
    # Removed mkdir/chown; expect host to have correct folders/permissions
    command: python app.py

  senkloud-frontend:
    build:
      context: ./senkloud-frontend
      dockerfile: Dockerfile
    container_name: senkloud-frontend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - flask-media-manager
    command: npm run dev -- --host 0.0.0.0 --port 8080

volumes:
  jellyfin_config:
    driver: local
  jellyfin_cache:
    driver: local
  flask_data:
    driver: local
  flask_thumbnails:
    driver: local
